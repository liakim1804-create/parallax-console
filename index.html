<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARALLAX 지휘통제 콘솔 (졸업작품 프로토타입)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 아이콘 스프라이트 (이모지 미사용, 전부 벡터) ============ -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ic-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="4.5" rx="1"/><rect x="13.5" y="10.5" width="7.5" height="10.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/></symbol>
    <symbol id="ic-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/><circle cx="20" cy="18" r="1.6"/></symbol>
    <symbol id="ic-map" viewBox="0 0 24 24"><path d="M9 4 3 6.2v14L9 18l6 2 6-2.2v-14L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="ic-officer" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.7-6 7.5-6s6.9 2 7.5 6"/></symbol>
    <symbol id="ic-cctv" viewBox="0 0 24 24"><path d="M3.2 8.6 16 4.9l1.9 6.2-12.8 3.7z"/><path d="M7 15.4V18a2 2 0 0 0 2 2h5"/><path d="M17.9 11.1 21 10.2"/></symbol>
    <symbol id="ic-briefing" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="ic-message" viewBox="0 0 24 24"><path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9h8M8 12.5h5"/></symbol>
    <symbol id="ic-progress" viewBox="0 0 24 24"><path d="M6 4v16"/><circle cx="6" cy="7.5" r="2"/><circle cx="6" cy="16.5" r="2"/><path d="M10 7.5h9M10 16.5h6"/></symbol>
    <symbol id="ic-ar" viewBox="0 0 24 24"><rect x="2.5" y="8.5" width="8" height="7" rx="2"/><rect x="13.5" y="8.5" width="8" height="7" rx="2"/><path d="M10.5 12h3M2.5 10.5 5 8M21.5 10.5 19 8"/></symbol>
    <symbol id="ic-send" viewBox="0 0 24 24"><path d="M12 20V5"/><path d="M6.5 10.5 12 5l5.5 5.5"/><path d="M4 21h16"/></symbol>
    <symbol id="ic-handover" viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M7 5.5H5V21h14V5.5h-2"/><path d="M8.5 12h7M8.5 16h4.5"/></symbol>
    <symbol id="ic-warning" viewBox="0 0 24 24"><path d="M12 3.5 1.8 20.5h20.4z"/><path d="M12 9.5v5"/><circle cx="12" cy="17.6" r="1.05" class="fillnow"/></symbol>
    <symbol id="ic-car" viewBox="0 0 24 24"><path d="M4.5 15.5h15l-1.7-5.4a2 2 0 0 0-1.9-1.4H8.1a2 2 0 0 0-1.9 1.4z"/><path d="M3.5 15.5h17v3h-17z"/><circle cx="7.5" cy="19.5" r="1.6"/><circle cx="16.5" cy="19.5" r="1.6"/></symbol>
    <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 21.5s7-6.8 7-11.4A7 7 0 1 0 5 10.1c0 4.6 7 11.4 7 11.4z"/><circle cx="12" cy="10" r="2.6"/></symbol>
    <symbol id="ic-flag" viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4.5h12l-2.8 4.2L18 13H6z"/></symbol>
    <symbol id="ic-bell" viewBox="0 0 24 24"><path d="M6.2 16.5v-5.2a5.8 5.8 0 1 1 11.6 0v5.2l2 3H4.2z"/><path d="M9.8 22h4.4"/></symbol>
    <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></symbol>
    <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="ic-min" viewBox="0 0 24 24"><path d="M5 18h14"/></symbol>
    <symbol id="ic-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></symbol>
    <symbol id="ic-restore" viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" rx="1.5"/><path d="M8 8V4h12v12h-4"/></symbol>
    <symbol id="ic-front" viewBox="0 0 24 24"><rect x="3" y="9" width="12" height="12" rx="1.5"/><rect x="9" y="3" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="ic-split2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16"/></symbol>
    <symbol id="ic-split4" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16M3 12h18"/></symbol>
    <symbol id="ic-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.3 5.7"/><path d="M4 5v6h6"/></symbol>
    <symbol id="ic-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M7 4.5 19 12 7 19.5z"/></symbol>
    <symbol id="ic-pause" viewBox="0 0 24 24"><rect x="6.5" y="4.5" width="4" height="15" rx="1"/><rect x="13.5" y="4.5" width="4" height="15" rx="1"/></symbol>
    <symbol id="ic-sound" viewBox="0 0 24 24"><path d="M4 9.5h4L13 5v14l-5-4.5H4z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6"/></symbol>
    <symbol id="ic-mute" viewBox="0 0 24 24"><path d="M4 9.5h4L13 5v14l-5-4.5H4z"/><path d="M16.5 9.5 21 14M21 9.5 16.5 14"/></symbol>
    <symbol id="ic-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 13h.01M18 13h.01M9.5 15.5h5"/></symbol>
    <symbol id="ic-capture" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="3.6"/><path d="M9 6.5 10.5 4h3L15 6.5"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19.5 7"/></symbol>
    <symbol id="ic-radio" viewBox="0 0 24 24"><path d="M7.5 4.5a10 10 0 0 0 0 15M16.5 4.5a10 10 0 0 1 0 15"/><circle cx="12" cy="12" r="2.4"/></symbol>
    <symbol id="ic-pushpin" viewBox="0 0 24 24"><path class="fillnow" d="M9 3h6l-.9 6.2L17 12v2H7v-2l2.9-2.8z"/><path d="M12 14v7"/></symbol>
    <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.6-3.6 3.4-5.6 7-5.6s6.4 2 7 5.6"/></symbol>
  </defs>
</svg>

<!-- ============ 상단 고정 상태바 ============ -->
<header class="statusbar" id="statusbar">
  <div class="sb-brand">
    <span class="sb-logo" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="sb-name">PARALLAX</span>
    <span class="sb-sub">지휘통제 콘솔</span>
  </div>

  <div class="sb-metrics" id="sbMetrics">
    <div class="sb-item" id="sbClock">
      <span class="sb-k">현재 시각</span>
      <span class="sb-v" id="sbClockVal">--:--:--</span>
    </div>
    <div class="sb-item sb-item-wide">
      <span class="sb-k">선택 사건</span>
      <span class="sb-v" id="sbIncident">선택 없음</span>
    </div>
    <div class="sb-item">
      <span class="sb-k">사건 위험도</span>
      <span class="sb-v" id="sbRisk"><span class="badge">-</span></span>
    </div>
    <div class="sb-item">
      <span class="sb-k">진행 중 사건</span>
      <span class="sb-v" id="sbActive">0건</span>
    </div>
    <div class="sb-item">
      <span class="sb-k">투입 인원</span>
      <span class="sb-v" id="sbStaff">0명</span>
    </div>
    <div class="sb-item">
      <span class="sb-k">통신 상태</span>
      <span class="sb-v" id="sbComm"><span class="badge">-</span></span>
    </div>
    <div class="sb-item" id="sbAlertItem">
      <span class="sb-k">긴급 알림</span>
      <span class="sb-v" id="sbAlerts"><span class="badge">0건</span></span>
    </div>
  </div>

  <div class="sb-actions">
    <button class="sb-btn" id="btnSim" type="button" title="가상 데이터 시뮬레이션 시작/정지 (Alt+S)" aria-pressed="false">
      <svg class="ic" aria-hidden="true"><use href="#ic-play"/></svg><span class="sb-btn-t">시뮬레이션 시작</span>
    </button>
    <button class="sb-btn" id="btnSound" type="button" title="긴급 음성 알림 켜기/끄기" aria-pressed="true">
      <svg class="ic" aria-hidden="true"><use href="#ic-sound"/></svg><span class="sb-btn-t">알림음 켜짐</span>
    </button>
    <button class="sb-btn" id="btnKeys" type="button" title="키보드 단축키 안내 (물음표 키)">
      <svg class="ic" aria-hidden="true"><use href="#ic-keyboard"/></svg><span class="sb-btn-t">단축키</span>
    </button>
    <div class="sb-profile" id="sbProfile" tabindex="0" title="로그인 사용자 (가상 계정)">
      <svg class="ic" aria-hidden="true"><use href="#ic-user"/></svg>
      <span class="sb-profile-t">
        <strong>정하윤 경감</strong>
        <small>중앙지휘통제실 · 상황1팀</small>
      </span>
    </div>
  </div>
</header>

<!-- ============ 본문: 런처 + 데스크톱 ============ -->
<div class="shell">
  <nav class="launcher" id="launcher" aria-label="앱 런처">
    <div class="launcher-title">앱 런처</div>
    <ul class="launcher-list" id="launcherList" role="list"></ul>
    <div class="launcher-foot">
      <div class="lf-k">화면 모드</div>
      <div class="lf-v" id="lfMode">-</div>
    </div>
    <div class="launcher-rz" id="launcherRz" role="separator" aria-orientation="vertical" tabindex="0"
      title="드래그하여 앱 런처 너비 조절 · 더블클릭 시 기본 너비 · 좌우 방향키로도 조절"
      aria-label="앱 런처 너비 조절"><span class="lrz-grip" aria-hidden="true"></span></div>
  </nav>

  <main class="desktop" id="desktop" aria-label="작업 영역">
    <div class="desktop-grid" aria-hidden="true"></div>
    <div class="windows" id="windows"></div>
    <div class="desktop-empty" id="desktopEmpty" hidden>
      <p class="de-1">열린 앱이 없습니다.</p>
      <p class="de-2">왼쪽 앱 런처에서 기능을 선택하거나, <kbd>Alt</kbd>+<kbd>1</kbd> ~ <kbd>Alt</kbd>+<kbd>9</kbd> 키로 실행하십시오.</p>
      <button class="btn btn-primary" type="button" data-act="restore-default">기본 화면 배치 불러오기</button>
    </div>
    <div class="compact-switch" id="compactSwitch" hidden></div>
  </main>
</div>

<!-- ============ 하단 작업 표시줄 ============ -->
<footer class="taskbar" id="taskbar">
  <div class="tb-left">
    <span class="tb-label">실행 중</span>
    <ul class="tb-apps" id="tbApps" role="list"></ul>
  </div>
  <div class="tb-right">
    <button class="tb-btn tb-alert" id="tbAlert" type="button" title="긴급 알림 기록 열기">
      <svg class="ic" aria-hidden="true"><use href="#ic-bell"/></svg>
      <span class="tb-btn-t">알림</span>
      <span class="tb-count" id="tbAlertCount">0</span>
    </button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button class="tb-btn" type="button" data-act="tile-2" title="화면 좌우 2분할 (Ctrl+Alt+2)">
      <svg class="ic" aria-hidden="true"><use href="#ic-split2"/></svg><span class="tb-btn-t">2분할</span>
    </button>
    <button class="tb-btn" type="button" data-act="tile-4" title="화면 4분할 (Ctrl+Alt+4)">
      <svg class="ic" aria-hidden="true"><use href="#ic-split4"/></svg><span class="tb-btn-t">4분할</span>
    </button>
    <button class="tb-btn" type="button" data-act="reset-layout" title="창 위치 초기화 - 기본 배치로 되돌리기 (Alt+R)">
      <svg class="ic" aria-hidden="true"><use href="#ic-reset"/></svg><span class="tb-btn-t">위치 초기화</span>
    </button>
  </div>
</footer>

<!-- ============ 오버레이 영역 ============ -->
<div class="urgent-stack" id="urgentStack" role="alert" aria-live="assertive"></div>
<div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>

<script src="app.js"></script>
</body>
</html>
